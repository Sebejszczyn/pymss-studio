name: Pymss Studio - poprawiony Windows EXE (bez instalacji Rust)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Pymss Studio Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Pobierz kod Pymss Studio z Twojego fork
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust w chmurze GitHub (nie na Twoim komputerze)
        uses: dtolnay/rust-toolchain@stable

      - name: Nanies poprawki na kod zrodlowy
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs';
          import path from 'node:path';

          // Pymss Studio user patch v3: designed for both CRLF and LF source code.
          const root = process.argv[2] ? path.resolve(process.argv[2]) : process.cwd();
          const changes = [];

          function edit(relative, update) {
            const filename = path.join(root, relative);
            if (!fs.existsSync(filename)) throw new Error(`Missing source file: ${filename}`);
            const before = fs.readFileSync(filename, 'utf8');
            const after = update(before);
            if (before !== after) changes.push({ filename, relative, before, after });
            else console.log(`Unchanged or already patched: ${relative}`);
          }
          function replaceUnique(source, regex, replacement, label) {
            const matches = [...source.matchAll(new RegExp(regex.source, 'g' + regex.flags.replace('g', '')))];
            if (matches.length !== 1) throw new Error(`${label}: expected one code anchor, found ${matches.length}. No changes written.`);
            return source.replace(regex, replacement);
          }

          try {
            edit('src/stores/task.ts', source => {
              if (source.includes('PYMSS_IMMEDIATE_STEMS_V3')) return source;
              const start = source.indexOf('function saveCurrentModelState(');
              const end = source.indexOf('function getSavedModelState(', start);
              if (start < 0 || end < 0) throw new Error('Cannot locate saveCurrentModelState function');
              let part = source.slice(start, end);
              part = replaceUnique(part, /\bqueueSeparateStatePersist\(\)/,
                '/* PYMSS_IMMEDIATE_STEMS_V3: save without 120ms delay */ persistSeparateState()',
                'model selection persistence');
              return source.slice(0, start) + part + source.slice(end);
            });

            edit('src/utils/appStore.ts', source => {
              if (source.includes('PYMSS_LOCAL_STEMS_MIRROR_V3')) return source;
              // Prefer the last committed selection snapshot in localStorage. This
              // also survives a native-store save rejected during app shutdown.
              source = replaceUnique(source,
                /(\bconst\s+value\s*=\s*await\s+invoke\s*<\s*T\s*\|\s*null\s*>\s*\(\s*['"]load_app_store['"]\s*,\s*\{\s*name\s*\}\s*\))/,
                `// PYMSS_LOCAL_STEMS_MIRROR_V3\n    if (name === 'separate-state') {\n      try {\n        const mirror = readLocalStore<T>(name)\n        if (mirror) return mirror\n      } catch { /* localStorage blocked; native store remains available */ }\n    }\n    $1`,
                'read separate-state mirror');
              // If native persistence fails (e.g. store denied), still load the mirror.
              source = replaceUnique(source,
                /if\s*\(\s*isMissingUpdateStore\(\s*error\s*,\s*name\s*\)\s*\)\s*return\s+readLocalStore\s*<\s*T\s*>\s*\(\s*name\s*\)/,
                `if (name === 'separate-state' || isMissingUpdateStore(error, name)) return readLocalStore<T>(name)`,
                'native read fallback');
              // Write mirror synchronously BEFORE scheduling any native async writes.
              source = replaceUnique(source,
                /(snapshot\s*=\s*JSON\.parse\s*\(\s*serialized\s*\)\s+as\s+unknown)/,
                `$1\n    if (name === 'separate-state') {\n      try { localStorage.setItem(localStoreKey(name), serialized) }\n      catch { /* Native store is still attempted below. */ }\n    }`,
                'synchronous separate-state mirror');
              return source;
            });

            edit('src-tauri/tauri.conf.json', source => {
              const config = JSON.parse(source);
              if (!config?.app?.windows?.length) throw new Error('Tauri main window not found');
              if (config.app.windows[0].maximized === true) return source;
              // Only insert the main window's maximized flag, keep all other configuration.
              config.app.windows[0].maximized = true;
              return JSON.stringify(config, null, 2) + '\n';
            });

            // Only write files when all compatibility checks have succeeded.
            for (const entry of changes) {
              const backup = entry.filename + '.pre-pymss-fix-v3.bak';
              if (!fs.existsSync(backup)) fs.writeFileSync(backup, entry.before, 'utf8');
            }
            for (const entry of changes) {
              fs.writeFileSync(entry.filename, entry.after, 'utf8');
              console.log(`Patched: ${entry.relative}`);
            }
            console.log('Pymss source patch v3 complete');
          } catch (error) {
            console.error(`PATCH FAILED: ${error.message}`);
            process.exitCode = 1;
          }
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\patch-pymss.mjs" -Encoding UTF8
          node --check "$env:RUNNER_TEMP\patch-pymss.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$env:RUNNER_TEMP\patch-pymss.mjs" "."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Zastosowano poprawki Pymss Studio v3."

      - name: Instaluj pakiety (na serwerze GitHub)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Zbuduj Pymss Studio EXE na Windows
        shell: pwsh
        run: pnpm tauri build --no-bundle

      - name: Upewnij sie, ze EXE istnieje
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path 'src-tauri/target/release' -Filter '*pymss*.exe' -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'Kompilacja nie wygenerowala pliku Pymss Studio EXE.' }
          $files | ForEach-Object { Write-Host "EXE: $($_.FullName)" }

      - name: Udostepnij gotowy EXE do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: PymssStudio_Poprawiony_Windows_x64
          path: src-tauri/target/release/*pymss*.exe
          if-no-files-found: error
          retention-days: 7
